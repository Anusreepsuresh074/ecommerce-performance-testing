# Lint and format settings for the helper scripts in scripts/ (same rules as ecommerce-api-automation).
# There is no Python package here: the scripts use only the standard library.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude", "context", "skills", "agents", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
