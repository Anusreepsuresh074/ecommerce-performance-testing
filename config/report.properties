# JMeter HTML dashboard settings, passed by scripts/build-dashboard.sh (-q).
# Written by perf-report from context/perf-test-plan.md v1.0.

# Apdex (plan NFR-01): satisfied = the normal-load p90 SLA, tolerated = 4x (the Apdex standard)
jmeter.reportgenerator.apdex_satisfied_threshold=1500
jmeter.reportgenerator.apdex_tolerated_threshold=6000

# Percentile columns = the plan's metrics (p90 is the SLA metric)
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# Graph points every 10 s
jmeter.reportgenerator.overall_granularity=10000

# Only the business transactions T01..T05
jmeter.reportgenerator.sample_filter=^T0[1-5]_.*
