# Settings shared by every run, passed first by scripts/run-test.sh (-q).
# Written by jmeter-test-plan from context/perf-test-plan.md v1.0.

# --- Extra columns saved into results.jtl (plan section 11) ---
# cacheStatus = cf-cache-status header, rateLimitRemaining = x-ratelimit-remaining header
sample_variables=cacheStatus,rateLimitRemaining

# --- Results file: CSV, timings only, never request or response data (context/perf-auth.md) ---
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.timestamp_format=ms

# --- Console progress line every 30 s during a run ---
summariser.name=summary
summariser.interval=30
summariser.out=true

# --- Safety ceiling (plan section 13): 5 req/s = 300 samples per minute, shared by all threads ---
safety.max.samples.per.min=300
